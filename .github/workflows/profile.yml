name: README

on:
  schedule:
    - cron: '0 0 * * *' # Once daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-update
  cancel-in-progress: true

jobs:
  update_readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This profile refresh is best-effort. Keep transient source failures from
    # failing the workflow run and generating failure notifications.
    continue-on-error: true

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v7
        with:
          # The historical archive contains thousands of JSON files and is not
          # needed to generate today's profile.
          sparse-checkout: |
            .github
            .gitignore
            README.md
            bio.json
            publications.json
          sparse-checkout-cone-mode: false

      - name: Checkout private scripts repository
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.SCRIPTS_REPO_NAME }}
          path: scripts
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/readme-requirements.txt

      - name: Install Python dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-input
          --prefer-binary
          --retries 1
          --timeout 10
          -r .github/readme-requirements.txt

      - name: Update README
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          OPEN_WEATHER_API: ${{ secrets.OPEN_WEATHER_API }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          TV_TIME_API_KEY: ${{ secrets.TV_TIME_API_KEY }}
          TV_TIME_API_SECRET: ${{ secrets.TV_TIME_API_SECRET }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          NINTENDO_JSON_URL: ${{ secrets.NINTENDO_JSON_URL }}
          LOCALE_URL: ${{ secrets.LOCALE_URL }}
          HAPPY_COW_URL: ${{ secrets.HAPPY_COW_URL }}
          OVERCAST_USERNAME: ${{ secrets.OVERCAST_USERNAME }}
          OVERCAST_SECRET: ${{ secrets.OVERCAST_SECRET }}
          OVERCAST_FALLBACK_URL: ${{ secrets.OVERCAST_FALLBACK_URL }}
          SPEAKERDECK_URL: ${{ secrets.SPEAKERDECK_URL }}
          SPEAKERDECK_USER_ID: ${{ secrets.SPEAKERDECK_USER_ID }}
          GIT_NAME: ${{ secrets.GIT_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          HEADERS_JSON: ${{ secrets.HEADERS_JSON }}
        run: >-
          python scripts/scripts/main.py ||
          echo "::warning::One or more data sources were unavailable. Committing any partial updates."

      - name: Check for changes
        id: git_diff
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard -- .historical_bio/)" ]; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.git_diff.outputs.changes_detected == 'true'
        run: |
          git config user.name "${{ secrets.GIT_NAME }}"
          git config user.email "${{ secrets.GIT_EMAIL }}"
          git add --sparse -- bio.json README.md publications.json
          git ls-files --others --exclude-standard -z -- .historical_bio/ | xargs -0 -r git add --sparse --
          git diff --cached --quiet && exit 0
          git commit -m '🤖 Updated README with latest stuff'
          git push
